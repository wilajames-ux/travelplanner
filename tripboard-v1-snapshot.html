svg text{font-family:Figtree,sans-serif}

@media print{nav,header p,.noprint,button,#modal{display:none!important}body{background:#fff;color:#000}.panel{border:0}input,select{border:0;appearance:none;-webkit-appearance:none;background:none;color:#000;padding:0}body.pd .day:not(.on),body.pd .city,body.pd .travel,body.pd h1.trip{display:none}input::placeholder{color:transparent}body.pvopen>*:not(#pv){display:none!important}#pv{position:static!important;overflow:visible!important;background:#fff!important}}
</style>

<body>
<header><div class="brand">Tripboard</div><p>Build your itinerary day by day. Use Decide together when the group can’t agree.</p></header>

<script>

const yt=q=>"https://www.youtube.com/results?search_query="+encodeURIComponent(q);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const mk=(id,n,e,h,la,lo,w,t,d)=>({id,n,e,h,la,lo,w,t,d});
const D={
lisbon:{n:"Lisbon, Portugal",e:"🚋",h:200,la:38.72,lo:-9.14,w:"Lisbon",t:"City break",d:"Hilly, sunny and walkable, with tiled streets, river views, custard tarts and vintage trams. Best for 3–5 days.",
stays:[mk("l-alfama","Alfama","🏘️",25,38.7119,-9.1299,"Alfama","Neighbourhood","Lisbon’s oldest district: narrow lanes, fado music and viewpoints. Atmospheric but steep, so pack light."),
mk("l-baixa","Baixa","🏙️",215,38.7106,-9.1394,"Baixa,_Lisbon","Neighbourhood","Flat, central grid of squares and shops with metro and train links. The easiest base for families."),
mk("l-pr","Príncipe Real","🌳",140,38.716,-9.15,"Príncipe_Real","Neighbourhood","Leafy, upscale area with boutiques, gardens and relaxed cafés. Quieter nights.")],
acts:[mk("l-belem","Belém Tower","🏰",190,38.6916,-9.216,"Belém_Tower","1 h","A 16th-century fortified tower on the Tagus, a symbol of Portugal’s Age of Discovery. Go early to skip the queue and walk the waterfront afterwards."),
mk("l-jer","Jerónimos Monastery","⛪",35,38.6979,-9.2068,"Jerónimos_Monastery","1.5 h","A Manueline masterpiece with a carved stone cloister. The famous custard-tart bakery next door is worth the line."),
mk("l-cas","São Jorge Castle","🏯",15,38.7139,-9.1334,"Castle_of_São_Jorge","2 h","Hilltop castle with sweeping views over red roofs and the river. Walk down through Alfama afterwards."),
mk("l-mkt","Time Out Market","🍴",350,38.7068,-9.1459,"Time_Out_Market_Lisbon","1.5 h","A big hall of well-known chefs and snack counters. Good for a group lunch where everyone picks their own."),
mk("l-lx","LX Factory","🎨",290,38.7036,-9.1787,"LX_Factory","2 h","Converted industrial complex of shops, studios and cafés under the 25 de Abril bridge."),
mk("l-tram","Tram 28 ride","🚋",50,38.7128,-9.1393,"Trams_in_Lisbon","1 h","The vintage yellow tram that rattles through Alfama, Graça and Baixa. Ride early or late to avoid crowds."),
mk("l-oce","Oceanário","🐠",195,38.7634,-9.0938,"Lisbon_Oceanarium","2.5 h","One of Europe’s largest aquariums, and a hit with kids.")]},
kyoto:{n:"Kyoto, Japan",e:"⛩️",h:350,la:35.01,lo:135.76,w:"Kyoto",t:"Culture trip",d:"Temples, gardens, tea houses and old wooden streets. Trains and buses make it easy to cover. Best for 3–5 days.",
stays:[mk("k-gion","Gion","🏮",10,35.0037,135.7756,"Gion,_Kyoto","Neighbourhood","Historic geisha district with wooden machiya houses, close to temples and evening dining."),
mk("k-sta","Kyoto Station area","🚉",210,34.9858,135.7588,"Kyoto_Station","Neighbourhood","Best transport hub: Shinkansen, airport express and buses. Practical and good value."),
mk("k-ara","Arashiyama","🎋",130,35.0094,135.6668,"Arashiyama","Neighbourhood","Quiet riverside district in the west, with bamboo and mountain views. Further from the centre.")],
acts:[mk("k-fus","Fushimi Inari Shrine","⛩️",5,34.9671,135.7727,"Fushimi_Inari-taisha","2 h","Thousands of vermilion torii gates winding up a forested hill. Go at dawn or dusk for fewer crowds."),
mk("k-kin","Kinkaku-ji","🏆",45,35.0394,135.7292,"Kinkaku-ji","1 h","The gold-leaf Zen temple mirrored in its pond. A short visit, easy to pair with nearby Ryoan-ji."),
mk("k-kiy","Kiyomizu-dera","🏯",20,34.9949,135.785,"Kiyomizu-dera","2 h","Wooden temple on a hillside with a huge veranda over the city. Walk down the lantern-lit lanes of Higashiyama."),
mk("k-bam","Arashiyama Bamboo Grove","🎋",125,35.017,135.6713,"Arashiyama","1.5 h","A path through towering bamboo. Combine with Tenryu-ji temple and a riverside stroll."),
mk("k-nis","Nishiki Market","🍢",30,35.005,135.7646,"Nishiki_Market","1.5 h","A covered street of food stalls known as Kyoto’s kitchen. Try pickles, tofu doughnuts and skewers."),
mk("k-phi","Philosopher’s Path","🌸",330,35.027,135.7948,"Philosopher%27s_Path","1 h","A canal-side walk lined with cherry trees, linking temples and small cafés.")]}
};
const ALL={};
Object.entries(D).forEach(([k,d])=>{d.id=k;ALL[k]=d;[...d.stays,...d.acts].forEach(i=>{i.dest=k;ALL[i.id]=i})});
const TIMES=["09:30","12:00","14:30","17:00","19:30"],COL=["#e4572e","#1f7a8c","#8a5cf5","#2e9e5b","#d6336c","#c98a00","#3d5a80"];
const fresh=()=>({draft:[],polls:[],clip:null,cities:[],destName:"",dest:null,stay:null,days:3,start:"",name:"",it:null,refs:[],album:{url:"",who:""},custom:{},grp:{step:0,names:[],voter:"",votes:{}}});
const rd=(k,f)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let S=Object.assign(fresh(),rd("tp_cur",{}));let view="plan";
const save=()=>wr("tp_cur",S);
const bg=h=>`linear-gradient(135deg,hsl(${h} 55% 42%),hsl(${(h+40)%360} 65% 58%))`;
const hav=(a,b)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(b.la-a.la),dn=r(b.lo-a.lo),x=Math.sin(dl/2)**2+Math.cos(r(a.la))*Math.cos(r(b.la))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
function travel(a,b,m){const km=hav(a,b);const auto=km<1.3?"Walk":km<12?"Transit":"Taxi";const mm=m||auto;const min=Math.round(mm==="Walk"?km*12:mm==="Transit"?km*3+10:mm==="Taxi"?km*2+5:km*2+8);return{mm,min:Math.max(min,2),km}}
const ICON={Walk:"🚶",Transit:"🚆",Taxi:"🚕",Drive:"🚗",Bike:"🚲"};
function card(i,sel,type){return `<div class="card ${sel?"sel":""}" data-open="${i.id}"><div class="img" style="background:${bg(i.h)}">${i.e}</div><div class="cb"><h3>${esc(i.n)}</h3><p>${esc(i.d)}</p><div class="row"><a href="${W+i.w}" target="_blank" rel="noopener" data-x>Website</a><button class="${sel?"g":"p"}" data-pick="${i.id}">${sel?"Added ✓":type==="dest"?"Choose":"Add"}</button></div></div></div>`}
function dayItems(){return S.it?S.it.map((d,di)=>d.map(x=>({...x,day:di}))):[S.acts.map(id=>({id,day:0}))]}
function build(){const st=ALL[S.stay];let left=S.acts.map(id=>ALL[id]),cur=st,order=[];while(left.length){left.sort((a,b)=>hav(cur,a)-hav(cur,b));cur=left.shift();order.push(cur.id)}
const per=Math.max(1,Math.ceil(order.length/S.days));S.it=Array.from({length:S.days},(_,d)=>order.slice(d*per,d*per+per).map((id,i)=>({id,time:TIMES[i]||"20:00",m:"",r:"",note:""})));save()}
function nav(){const t=[["plan","Plan"],["map","Map"],["itin","Itinerary"],["media","Videos & album"],["trips","My trips"]];document.getElementById("nav").innerHTML=t.map(([k,l])=>`<button class="${view===k?"on":""}" data-view="${k}">${l}</button>`).join("")}
function plan(){const st=S.step,D0=ALL[S.dest];const labels=["Destination","Stay","Activities","Trip details"];
let h=`<div class="steps">${labels.map((l,i)=>`<span class="${i<=st?"on":""}"></span>`).join("")}</div><h2>${["Where to?","Where will you stay?","What do you want to do?","Trip details"][st]}</h2><p style="color:var(--mut)">${["Pick one destination for this trip.","Choose a neighbourhood to use as your base.","Tap cards to add. Tap a card’s body for full details.","Name it and set the length. Then build your itinerary."][st]}</p>`;
if(st===0)h+=`<div class="grid">${Object.values(D).map(d=>card(d,S.dest===d.id,"dest")).join("")}</div>`;
if(st===1)h+=`<div class="grid">${D0.stays.map(i=>card(i,S.stay===i.id)).join("")}</div>`;
if(st===2)h+=`<div class="grid">${D0.acts.map(i=>card(i,S.acts.includes(i.id))).join("")}</div>`;
if(st===3)h+=`<div class="panel"><label>Trip name</label><input data-f="name" value="${esc(S.name||D0.n+" trip")}"><label>Start date</label><input type="date" data-f="start" value="${esc(S.start)}"><label>Number of days</label><input type="number" min="1" max="14" data-f="days" value="${S.days}"><p style="color:var(--mut)">${S.acts.length} activities will be spread across the days, grouped by what is close together.</p></div>`;

h+=`<div class="bar"><button class="g" data-step="-1" ${st?"":"disabled"}>Back</button>${st<3?`<button class="p" data-step="1" ${ok?"":"disabled"}>Next</button>`:`<button class="p" data-build>Build itinerary</button>`}</div>`;return h}
function map(){const items=dayItems();const pts=[];if(S.stay)pts.push({...ALL[S.stay],stay:1,day:-1});items.forEach((d,di)=>d.forEach(x=>{const a=ALL[x.id];if(a&&a.la!=null)pts.push({...a,n:x.name||a.n,day:di})}));
if(!pts.length)return `<div class="empty">Add stops to your itinerary and pins appear here automatically.</div>`;
const la=pts.map(p=>p.la),lo=pts.map(p=>p.lo),mnA=Math.min(...la),mxA=Math.max(...la),mnO=Math.min(...lo),mxO=Math.max(...lo);const k=Math.cos((mnA+mxA)/2*Math.PI/180);
const sw=Math.max((mxO-mnO)*k,.004),sh=Math.max(mxA-mnA,.004),sc=Math.min(500/sw,300/sh),X=p=>300+((p.lo-(mnO+mxO)/2)*k)*sc,Y=p=>190-(p.la-(mnA+mxA)/2)*sc;
let svg=`<svg viewBox="0 0 600 380" width="100%" style="min-width:520px;display:block;background:var(--card)"><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="var(--line)"/></pattern></defs><rect width="600" height="380" fill="url(#g)"/>`;
items.forEach((d,di)=>{const line=[...(S.stay&&S.it?[ALL[S.stay]]:[]),...d.map(x=>ALL[x.id]).filter(p=>p&&p.la!=null)];if(line.length>1)svg+=`<polyline points="${line.map(p=>X(p)+","+Y(p)).join(" ")}" fill="none" stroke="${COL[di%7]}" stroke-width="2.5" stroke-dasharray="6 5" opacity=".7"/>`});
let n=0;pts.forEach(p=>{const x=X(p),y=Y(p);if(p.stay)svg+=`<g data-open="${p.id}" style="cursor:pointer"><rect x="${x-11}" y="${y-11}" width="22" height="22" rx="5" fill="var(--ink)"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="14">🏠</text><text x="${x}" y="${y+27}" text-anchor="middle" font-size="11" fill="var(--ink)">${esc(p.n)}</text></g>`;
else{n++;svg+=`<g data-open="${p.id}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="12" fill="${COL[p.day%7]}"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">${n}</text><text x="${x}" y="${y+27}" text-anchor="middle" font-size="11" fill="var(--ink)">${esc(p.n)}</text></g>`}});svg+="</svg>";
const route="https://www.google.com/maps/dir/"+pts.map(p=>p.la+","+p.lo).join("/");let m=0;
return `<h2>${esc(S.destName||(ALL[S.dest]||{}).n||"Map")}</h2><p style="color:var(--mut)">Pins fill in from your picks. Colours show the day. This is a schematic map; open Google Maps for streets.</p><div class="mapwrap">${svg}</div><div class="bar"><a href="${route}" target="_blank" rel="noopener">Open full route in Google Maps</a></div><div class="panel">${pts.map(p=>p.stay?`<div>🏠 <a href="${gm(p.la,p.lo)}" target="_blank" rel="noopener">${esc(p.n)}</a> (stay)</div>`:`<div>${++m}. <a href="${gm(p.la,p.lo)}" target="_blank" rel="noopener">${esc(p.n)}</a>${S.it?" · Day "+(p.day+1):""}</div>`).join("")}</div>`}
function dlabel(d){if(!S.start)return "";const t=new Date(S.start+"T00:00");t.setDate(t.getDate()+d);return " · "+t.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}
function itin(){if(!S.it)return `<div class="empty">No itinerary yet. Finish the Plan steps and tap Build itinerary.</div>`;
let h=`<div class="noprint bar" style="margin:0 0 8px"><h2>${esc(S.name||"My trip")}</h2><div><button class="p" data-print="all">Print whole trip</button></div></div><div style="color:var(--mut)">${esc(ALL[S.dest].n)} · stay in ${esc(ALL[S.stay].n)}${S.start?" · from "+esc(new Date(S.start+"T00:00").toLocaleDateString()):""}</div>`;
S.it.forEach((day,di)=>{h+=`<section class="day panel" data-day="${di}"><div class="bar" style="margin:0"><h2 style="margin:0">Day ${di+1}${dlabel(di)}</h2><button class="g noprint" data-print="${di}">Print this day</button></div>`;

if(b=t.closest("[data-paste]")){const gi=+b.dataset.gi,c=S.clip;if(!c)return;const a=mkCustom(c.k),time=c.k==="stay"?"15:00":c.k==="travel"?"09:00":(TIMES[S.it[gi].length]||"20:00");S.custom[a.id]=a;reg();S.it[gi].push({id:a.id,time,out:c.k==="stop"?addMin(time,90):"",link:c.link||"",addr:c.addr||"",video:c.video||"",cost:c.cost||"",note:c.note||"",name:c.name||"",emoji:c.emoji||"",tm:c.tm||"",m:"",r:""});save();render();toast("Pasted into the day.")}});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;
if(d.fe!==undefined){const it=LST(d.l)[+d.i];if(!it)return;it[d.fe]=t.value;save();if(d.fe==="emoji")emoOpen=null;if(d.fe!=="name")render();return}
if(d.pt!==undefined){const p=S.polls.find(x=>x.id===d.pt);if(p){p.title=t.value;save()}return}
if(d.fdraft!==undefined&&t.value){const s=S.draft.find(x=>x.id===t.value);if(s){LST(d.l).push({...s,id:newItem(s.k).id,votes:{}});save();toast("Copied from Draft.")}render()}});
document.addEventListener("input",e=>{const d=e.target.dataset;if(d.fe==="note"||d.fe==="cost"||d.fe==="addr"){const el=document.querySelector('[data-sn="'+d.l+'|'+d.i+'-'+d.fe+'"]');if(el)el.textContent=({cost:"💰 ",addr:"🗺️ "}[d.fe]||"")+(e.target.value||(d.fe==="addr"?"Map":""))}});
/* ---- PDF export with clickable links ---- */
const PV2=`.doc{font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:#111;background:#fff;max-width:760px;margin:0 auto;padding:24px;border-radius:10px;box-sizing:border-box}.doc h1{font:700 34px/1.15 system-ui,sans-serif;margin:0 0 4px}.doc h2{font:700 26px/1.15 system-ui,sans-serif;margin:30px 0 8px;padding-top:12px;border-top:5px solid #f2b632}.doc h3{font:700 17px/1.2 system-ui,sans-serif;margin:18px 0 6px}.doc .m{color:#555;margin:2px 0}.doc .st{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:7px 0;border-top:1px dashed #ccc}.doc .t{font-weight:600;color:#333}.doc .tr{border:1px dashed #999;border-radius:8px;padding:8px 10px;margin:22px 0 0}.doc a{color:#0b5c70}.doc .bar{margin-bottom:14px}.doc .bar button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #888;background:#fff;cursor:pointer}@media print{.doc .bar{display:none}.doc{padding:0}}`;
function pvDoc(scope){return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(S.name||"Trip")}</title><style>body{margin:0;background:#fff}${PV2}</style></head><body><div class="doc"><div class="bar"><button onclick="window.print()">Print</button></div>${pvBody(scope)}</div></body></html>`}
function openPV(scope){pvScope=scope;let p=document.getElementById("pv");if(!p){p=document.createElement("div");p.id="pv";p.style.cssText="position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:env(safe-area-inset-top,0px) 12px 40px";p.innerHTML=`<div class="noprint" style="max-width:760px;margin:10px auto;display:flex;gap:8px;flex-wrap:wrap"><button class="g" data-pvclose>← Back</button><button class="p" data-pvpdf>Save as PDF</button><button class="g" data-pvsave>Save as HTML</button><button class="g" data-pvprint>Print</button></div><div id="pvnote" class="noprint" style="max-width:760px;margin:0 auto 8px;color:var(--mut);font-size:14px"></div><div id="pvdoc"></div>`;document.body.appendChild(p)}
document.getElementById("pvdoc").innerHTML=`<style>${PV2}</style><div class="doc">${pvBody(scope)}</div>`;document.getElementById("pvnote").textContent="";p.hidden=false;document.body.classList.add("pvopen");p.scrollTop=0}
const fname=()=>((S.name||"trip").replace(/[\\/:*?"<>|]+/g,"").trim().replace(/\s+/g,"-")||"trip")+(pvScope==="all"?"":"-day-"+(+pvScope+1));
async function savePDF(){const n=document.getElementById("pvnote");
if(!window.jspdf||!window.html2canvas){n.textContent="The PDF tools didn’t load. Check your connection and try again, or use Save as HTML.";return}
try{const dl=window.claude?await claude.use("downloads"):null;if(!dl){n.textContent="Saving isn’t available in this view. Try opening the page from claude.ai.";return}
n.textContent="Making your PDF…";const p=document.getElementById("pv");p.scrollTop=0;window.scrollTo(0,0);
const el=document.querySelector("#pvdoc .doc"),{jsPDF}=window.jspdf,pdf=new jsPDF({unit:"pt",format:"a4"}),PW=pdf.internal.pageSize.getWidth(),PH=pdf.internal.pageSize.getHeight(),M=28;
const W=el.offsetWidth,H=el.offsetHeight,k=(PW-2*M)/W,pageH=(PH-2*M)/k,er=el.getBoundingClientRect();
const cv=await html2canvas(el,{scale:Math.min(2,14000/H),backgroundColor:"#fff",useCORS:true,logging:false,scrollX:0,scrollY:0}),S2=cv.width/W;
const tops=[...el.querySelectorAll(".st,h2,h3,.tr")].map(x=>x.getBoundingClientRect().top-er.top).sort((a,b)=>a-b);
const br=[0];let y=0;while(y+pageH<H){let nb=y+pageH;const c=tops.filter(t=>t>y+pageH*0.5&&t<=nb);if(c.length)nb=c[c.length-1];br.push(nb);y=nb}br.push(H);
for(let q=0;q<br.length-1;q++){const y0=br[q],y1=br[q+1],h=y1-y0;if(q)pdf.addPage();const sc=document.createElement("canvas");sc.width=cv.width;sc.height=Math.max(1,Math.round(h*S2));sc.getContext("2d").drawImage(cv,0,Math.round(y0*S2),cv.width,sc.height,0,0,cv.width,sc.height);pdf.addImage(sc.toDataURL("image/jpeg",0.92),"JPEG",M,M,W*k,h*k);
el.querySelectorAll("a[href]").forEach(a=>{for(const r of a.getClientRects()){const ry=r.top-er.top;if(ry>=y0-1&&ry<y1-1)pdf.link(M+(r.left-er.left)*k,M+(ry-y0)*k,r.width*k,r.height*k,{url:a.href})}})}
await dl.save({filename:fname()+".pdf",data:pdf.output("blob")});n.textContent="PDF saved. Links inside it are clickable."}catch(err){n.textContent=err&&err.code==="declined"?"Save cancelled.":"The PDF couldn’t be made. Try Save as HTML instead."}}
document.addEventListener("click",e=>{if(e.target.closest("[data-pvpdf]"))savePDF()});
render();
</script>
</body>
